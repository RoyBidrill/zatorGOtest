<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZatorGO</title>
  <link rel="icon" type="image/png" href="favicon.png?v=7b5f9030">
  <link rel="apple-touch-icon" href="icon.png?v=7b5f9030">
  <script>
    try {
      var t = localStorage.getItem('zatorgo-theme') || localStorage.getItem('z2r-theme');
      if (t === 'light' || t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
    <link rel="stylesheet" href="styles.css?v=35e9a9d7">
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=7600223d"></script>
</body>
</html>
